# Copy to .github/workflows/ci.yml
# Action versions were current majors in late 2026; bump them when newer majors exist.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
